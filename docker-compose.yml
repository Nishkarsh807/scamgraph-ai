version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: scamgraph_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./scamgraph.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./ml/saved_models:/app/ml/saved_models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: scamgraph_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
